<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- 
  Ícone SVG de uma tela de apresentação com gráfico financeiro.
  Baseado na imagem fornecida pelo usuário.
  Autor: Gemini
-->
<svg width="200" height="200" viewBox="0 0 100 100" version="1.1" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title-pres" role="img">
	<title id="title-pres">Ícone de Apresentação Financeira</title>

	<!-- Estrutura da tela de apresentação -->
	<g id="screen-structure">
		<!-- Borda superior e inferior -->
		<rect x="5" y="5" width="90" height="10" fill="#263238" />
		<rect x="5" y="85" width="90" height="10" fill="#263238" />

		<!-- Fundo da tela -->
		<rect x="5" y="15" width="90" height="70" fill="#CFD8DC" />

		<!-- Base/Pé -->
		<circle cx="50" cy="96" r="4" fill="#E57373" />
	</g>

	<!-- Conteúdo da Apresentação -->
	<g id="screen-content">
		<!-- Gráfico de Pizza -->
		<g id="pie-chart" transform="translate(38, 48)">
			<!-- Segmento Laranja (~75%) -->
			<path d="M 0,0 L 0,-22 A 22,22 0 1 1 -15.55,15.55 Z" fill="#FFCA28" stroke="#212121" stroke-width="2" />
			<!-- Segmento Verde (~25%) -->
			<path d="M 0,0 L -15.55,15.55 A 22,22 0 0 1 0,-22 Z" fill="#66BB6A" stroke="#212121" stroke-width="2" />
		</g>

		<!-- Linhas de texto simuladas -->
		<g id="text-lines" fill="#455A64">
			<rect x="65" y="32" width="22" height="4" rx="1" />
			<rect x="65" y="42" width="22" height="4" rx="1" />
			<rect x="65" y="52" width="22" height="4" rx="1" />
		</g>
	</g>
</svg>
